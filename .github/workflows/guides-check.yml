name: Guides build check

# Fails if someone edits content/guides/*.md (or the generator) without
# re-running `python3 tools/geo/build.py` and committing the output.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generated pages are up to date
        run: python3 tools/geo/build.py --check
